server:
  port: 8080

spring:
  application:
    name: ai-resume-match-system

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/resume_match?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:liang}

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # Jackson配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis Plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-make-it-long-enough-for-security}
  expiration: ${JWT_EXPIRATION:86400000}

# AI服务配置
ai:
  provider: minimax
  minimax:
    api-key: ${MINIMAX_API_KEY:sk-cp-iCew77xFVaj3X2qOGvn11Ne6yHQz0Y24mDzqgJP-xSOJ9rjR2fBoZRypWezLt7XlVb3LW3o6xS1CtGrdfs2FwsYpevTgE690oXdnT8AYSPUL_w_zi5XktnM}
    base-url: ${MINIMAX_BASE_URL:https://api.minimax.chat/v1}
    model: ${MINIMAX_MODEL:Minimax-Text-01}

# 文件存储路径
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads/resumes}

# 日志配置
logging:
  level:
    com.liangge: debug
